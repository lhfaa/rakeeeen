openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ركين - منصة الوساطة الإلكترونية API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: Users
  - name: brokers
    description: Brokers
  - name: transactions
    description: Transactions
  - name: messages
    description: Messages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /brokers:
    get:
      operationId: listBrokers
      tags: [brokers]
      summary: List all brokers
      responses:
        "200":
          description: List of brokers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Broker"
    post:
      operationId: createBroker
      tags: [brokers]
      summary: Add a broker (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrokerInput"
      responses:
        "201":
          description: Broker created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broker"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /brokers/{id}:
    delete:
      operationId: deleteBroker
      tags: [brokers]
      summary: Remove a broker (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Broker removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions for current user
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a new transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/all:
    get:
      operationId: listAllTransactions
      tags: [transactions]
      summary: List all transactions (broker/admin)
      responses:
        "200":
          description: All transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/stats:
    get:
      operationId: getTransactionStats
      tags: [transactions]
      summary: Get platform stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete transaction (broker/admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /transactions/{id}/close:
    patch:
      operationId: closeTransaction
      tags: [transactions]
      summary: Close a transaction (broker)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}/pay:
    post:
      operationId: payTransaction
      tags: [transactions]
      summary: Simulate payment for a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}/transfer:
    post:
      operationId: transferToSeller
      tags: [transactions]
      summary: Broker transfers funds to seller
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transfer done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /wallet:
    get:
      operationId: getWallet
      tags: [users]
      summary: Get current user wallet balance
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"

  /wallet/broker-transfer:
    post:
      operationId: brokerTransfer
      tags: [users]
      summary: Broker transfers money to any user by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrokerTransferInput"
      responses:
        "200":
          description: Transfer done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerTransferResult"

  /wallet/withdraw:
    post:
      operationId: withdrawWallet
      tags: [users]
      summary: Withdraw from wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawInput"
      responses:
        "200":
          description: Withdraw done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"

  /transactions/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Get messages for a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    RegisterInput:
      type: object
      required: [username, email, password, phone, countryCode]
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
        password:
          type: string
          minLength: 6
        phone:
          type: string
        countryCode:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, username, email, phone, countryCode, role, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        countryCode:
          type: string
        role:
          type: string
          enum: [user, broker, admin]
        createdAt:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    Broker:
      type: object
      required: [id, userId, username, email, phone, transactionCount, successRate, avgTime, rating, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        transactionCount:
          type: integer
        successRate:
          type: number
        avgTime:
          type: string
        rating:
          type: number
        createdAt:
          type: string

    BrokerInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer

    Transaction:
      type: object
      required: [id, title, description, amount, type, status, buyerId, sellerId, brokerId, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        amount:
          type: number
        type:
          type: string
        status:
          type: string
          enum: [pending, active, paid, completed, closed, cancelled]
        buyerId:
          type: integer
        sellerId:
          type: integer
        brokerId:
          type: integer
        buyerName:
          type: ["string", "null"]
        sellerName:
          type: ["string", "null"]
        brokerName:
          type: ["string", "null"]
        createdAt:
          type: string

    TransactionInput:
      type: object
      required: [title, description, amount, type, brokerId, sellerEmail]
      properties:
        title:
          type: string
        description:
          type: string
        amount:
          type: number
        type:
          type: string
        brokerId:
          type: integer
        sellerEmail:
          type: string

    Message:
      type: object
      required: [id, transactionId, senderId, senderName, content, messageType, createdAt]
      properties:
        id:
          type: integer
        transactionId:
          type: integer
        senderId:
          type: integer
        senderName:
          type: string
        senderRole:
          type: ["string", "null"]
        content:
          type: string
        messageType:
          type: string
          enum: [text, system, payment]
        createdAt:
          type: string

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string

    BrokerTransferInput:
      type: object
      required: [email, amount]
      properties:
        email:
          type: string
        amount:
          type: number

    BrokerTransferResult:
      type: object
      required: [recipientName, newBalance]
      properties:
        recipientName:
          type: string
        newBalance:
          type: number

    WalletBalance:
      type: object
      required: [balance]
      properties:
        balance:
          type: number

    WithdrawInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number

    PlatformStats:
      type: object
      required: [userCount, transactionCount, successRate, brokerCount, totalAmount]
      properties:
        userCount:
          type: integer
        transactionCount:
          type: integer
        successRate:
          type: number
        brokerCount:
          type: integer
        totalAmount:
          type: number
