services:
  - type: web
    name: rakeen
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rakeen-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://rakeen.online,https://www.rakeen.online
      - key: FRONTEND_DIST
        value: /opt/render/project/src/artifacts/rakeen/dist/public

databases:
  - name: rakeen-db
    plan: starter